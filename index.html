<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="description" content="Content Planner — kalendar peribadi Michelle Claire.">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Content Planner">
  <title>Content Planner</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <aside class="nav" id="side-nav">
      <div class="brand">
        <img src="./icons/icon-192.png" width="40" height="40" alt="">
        <div>
          <strong>Content Planner</strong>
          <span>Michelle Claire</span>
        </div>
      </div>
      <nav class="nav-links" aria-label="Menu">
        <button type="button" data-nav="bulan"><span class="label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Bulan</span></button>
        <button type="button" data-nav="minggu"><span class="label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4h4v16h-4z"/></svg>Minggu</span></button>
        <button type="button" data-nav="senarai"><span class="label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Senarai</span></button>
        <button type="button" data-nav="notis"><span class="label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Notis</span><span id="nav-badge" class="badge" hidden>0</span></button>
        <button type="button" data-nav="tetapan"><span class="label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>Tetapan</span></button>
      </nav>
      <div class="nav-foot">
        <div class="sync-pill"><span class="sync-dot"></span><span data-sync-label>Demo</span></div>
      </div>
    </aside>

    <section class="main">
      <header class="top">
        <div class="top-row">
          <div class="title-block">
            <div class="mobile-wordmark">
              <img class="logo-mark" src="./icons/icon-192.png" width="32" height="32" alt="">
              <span>Content Planner</span>
            </div>
            <h1 id="period-title">Content Planner</h1>
          </div>
          <div class="top-tools">
            <div class="sync-pill only-mobile"><span class="sync-dot"></span><span data-sync-label>Demo</span></div>
            <button type="button" id="btn-bell" class="icon-btn" aria-label="Notifikasi" data-testid="bell">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
              <span id="bell-badge" class="badge" hidden>0</span>
            </button>
            <button type="button" id="btn-settings" class="icon-btn only-mobile" aria-label="Tetapan">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
          </div>
        </div>
        <div class="controls">
          <div class="segment" id="segment" role="tablist" aria-label="Paparan">
            <button type="button" data-nav="bulan">Bulan</button>
            <button type="button" data-nav="minggu">Minggu</button>
            <button type="button" data-nav="senarai">Senarai</button>
          </div>
          <div class="pager" id="pager">
            <button type="button" id="btn-prev" aria-label="Sebelum">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button type="button" id="btn-next" aria-label="Seterusnya">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <button type="button" id="btn-today" class="btn-ghost">Hari ini</button>
          <button type="button" id="btn-add" class="btn-primary" data-testid="add-button">+ Tambah</button>
        </div>
        <div id="filter-row" class="filter-row">
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="search" type="search" placeholder="Cari tajuk..." aria-label="Cari tajuk" autocomplete="off">
          </label>
          <div id="brand-filters" class="chip-row" role="group" aria-label="Jenama"></div>
          <div id="type-filters" class="chip-row" role="group" aria-label="Jenis"></div>
          <div id="status-filters" class="chip-row" role="group" aria-label="Status"></div>
        </div>
        <div id="demo-banner" class="demo-banner" hidden>
          Mod demo — data di telefon atau laptop ini sahaja.
          <button type="button" data-nav="tetapan">Sambung Sheet</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </section>

    <aside class="day-panel" id="day-panel" data-testid="day-panel">
      <div id="day-panel-body"></div>
    </aside>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Menu bawah">
    <button type="button" data-nav="bulan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Bulan
    </button>
    <button type="button" data-nav="minggu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4h4v16h-4z"/></svg>
      Minggu
    </button>
    <button type="button" data-nav="senarai">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Senarai
    </button>
    <button type="button" data-nav="notis">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      Notis
      <span id="tab-badge" class="badge" hidden>0</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
